name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck and test
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test

  images:
    name: Build Docker image (${{ matrix.image }})
    needs: checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          [
            node,
            bun,
            deno,
            perry,
            scriptc,
            porffor,
            static_hermes,
            oseo,
            spinel,
            lython,
            cpython,
            cruby,
            benchmark,
          ]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: dockerfiles/${{ matrix.image }}.dockerfile
          tags: native-js-dream/${{ matrix.image }}:check
          cache-from: type=gha,scope=image-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.image }}

  benchmark:
    name: Build, run, and benchmark (${{ matrix.tool }})
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tool: node-cache-off, image: node }
          - { tool: node-cache-on, image: node }
          - { tool: bun-cache-off, image: bun }
          - { tool: bun-cache-on, image: bun }
          - { tool: bun-canary-cache-off, image: bun }
          - { tool: bun-canary-cache-on, image: bun }
          - { tool: bun-aot, image: bun }
          - { tool: bun-aot-typescript, image: bun }
          - { tool: bun-aot-trim, image: bun }
          - { tool: bun-aot-typescript-trim, image: bun }
          - { tool: deno-v8-cache-off, image: deno }
          - { tool: deno-v8-cache-on, image: deno }
          - { tool: deno-quickjs, image: deno }
          - { tool: perry, image: perry }
          - { tool: perry-typescript, image: perry }
          - { tool: scriptc, image: scriptc }
          - { tool: scriptc-typescript, image: scriptc }
          - { tool: porffor, image: porffor }
          - { tool: static_hermes, image: static_hermes }
          - { tool: static_hermes-flow, image: static_hermes }
          - { tool: oseo, image: oseo }
          - { tool: oseo-typescript, image: oseo }
          - { tool: spinel, image: spinel }
          - { tool: lython, image: lython }
          - { tool: cpython-source, image: cpython, source: true }
          - { tool: cruby-source, image: cruby, source: true }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build tool image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: dockerfiles/${{ matrix.image }}.dockerfile
          load: true
          tags: native-js-dream/${{ matrix.image }}:check
          cache-from: type=gha,scope=image-${{ matrix.image }}
      - name: Build benchmark image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: dockerfiles/benchmark.dockerfile
          load: true
          tags: native-js-dream/benchmark:check
          cache-from: type=gha,scope=image-benchmark
      - name: Build ${{ matrix.tool }}
        if: ${{ !matrix.source }}
        run: >-
          pnpm cli compile --tool "${{ matrix.tool }}" --workload hello
          --skip-image-build
      - name: Run ${{ matrix.tool }}
        if: ${{ !matrix.source }}
        run: >-
          pnpm cli run-binary --tool "${{ matrix.tool }}" --workload hello
          --skip-image-build
      - name: Run source ${{ matrix.tool }}
        if: ${{ matrix.source }}
        run: >-
          pnpm cli run --tool "${{ matrix.tool }}" --workload hello
          --skip-image-build
      - name: Benchmark ${{ matrix.tool }}
        run: >-
          pnpm cli bench --tool "${{ matrix.tool }}" --workload hello
          --mode process --samples 5 --warmup 1 --skip-image-build
      - name: Collect benchmark result
        env:
          TOOL: ${{ matrix.tool }}
        run: |
          mkdir -p reports
          cp "build/docker/bench-process-${TOOL}-hello/result.json" "reports/${TOOL}.json"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmark-${{ matrix.tool }}
          path: reports/${{ matrix.tool }}.json
          if-no-files-found: error
          retention-days: 1

  summary:
    name: Benchmark summary
    needs: benchmark
    runs-on: ubuntu-slim
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: benchmark-*
          path: reports
          merge-multiple: true
      - name: Write benchmark summary
        run: |
          {
            echo '## Benchmark results'
            echo
            echo 'The `hello` process benchmark runs five measured samples after one warmup.'
            echo
            echo '| Configuration | Median (ms) | p95 (ms) | First (ms) | Last (ms) |'
            echo '| --- | ---: | ---: | ---: | ---: |'
            jq -r -s '
              sort_by(.stats.medianMs)[] |
              "| \(.name) | \(.stats.medianMs) | \(.stats.p95Ms) | \(.stats.firstMs) | \(.stats.lastMs) |"
            ' reports/*.json
          } >> "$GITHUB_STEP_SUMMARY"
